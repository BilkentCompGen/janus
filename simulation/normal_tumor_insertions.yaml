# Normal-Tumor Simulation Configuration - INSERTIONS ONLY
# This config simulates a tumor genome with INSERTIONS only compared to the normal (reference) genome
# The reference genome serves as the "normal" genome
# The output will be the "tumor" genome with insertions applied

reference: './ref.fasta'

# Constrain all SVs to chromosome 19 only, covering the full 58MB
overlap_regions: ['chr19.bed']

variant_sets:
    # ------------------------------------------------------------
    # INSERTIONS ONLY
    # ------------------------------------------------------------
    # Small insertions (1-100 bp)
    - type: "INS"
      number: 100
      length_ranges: [[1, 100]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Medium insertions (100-1000 bp)
    - type: "INS"
      number: 50
      length_ranges: [[100, 1000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Large insertions (1-10 kb)
    - type: "INS"
      number: 30
      length_ranges: [[1000, 10000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Very large insertions (10-100 kb)
    - type: "INS"
      number: 15
      length_ranges: [[10000, 100000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]

# Optional: Set minimum distance between SVs to avoid overlap
min_intersv_dist: 50

# Generate only 1 FASTA file instead of hapA and hapB
haploid: True
