# Normal-Tumor Simulation Configuration
# This config simulates a tumor genome with deletions, insertions, and SNPs compared to the normal (reference) genome
# The reference genome serves as the "normal" genome
# The output will be the "tumor" genome with variants applied

reference: './ref.fasta'

# Constrain all SVs to chromosome 19 only, covering the full 58MB
overlap_regions: ['chr19.bed']

variant_sets:
    # ------------------------------------------------------------
    # DELETIONS
    # ------------------------------------------------------------
    # Small deletions (1-100 bp)
    - type: "DEL"
      number: 100
      length_ranges: [[1, 100]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Medium deletions (100-1000 bp)
    - type: "DEL"
      number: 50
      length_ranges: [[100, 1000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Large deletions (1-10 kb)
    - type: "DEL"
      number: 30
      length_ranges: [[1000, 10000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Very large deletions (10-100 kb)
    - type: "DEL"
      number: 15
      length_ranges: [[10000, 100000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]

    # ------------------------------------------------------------
    # INSERTIONS
    # ------------------------------------------------------------
    # Small insertions
    # - type: "INS"
    #   number: 50
    #   length_ranges: [[1, 100]]
    #   overlap_mode: "contained"
    #   overlap_region_type: ["chr19"]

    # # Medium insertions
    # - type: "INS"
    #   number: 30
    #   length_ranges: [[100, 1000]]
    #   overlap_mode: "contained"
    #   overlap_region_type: ["chr19"]

# Optional: Set minimum distance between SVs to avoid overlap
min_intersv_dist: 50

# Generate only 1 FASTA file instead of hapA and hapB
haploid: True
