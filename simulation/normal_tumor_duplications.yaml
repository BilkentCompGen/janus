# Normal-Tumor Simulation Configuration
# This config simulates a tumor genome with duplications compared to the normal (reference) genome
# The reference genome serves as the "normal" genome
# The output will be the "tumor" genome with variants applied

reference: '/home/yuio/svp/simulation/ref.fasta'

# Constrain all SVs to chromosome 19 only, covering the full 58MB
overlap_regions: ['/home/yuio/svp/simulation/chr19.bed']

variant_sets:
    # ------------------------------------------------------------
    # DUPLICATIONS
    # ------------------------------------------------------------
    # Small duplications (1-100 bp)
    - type: "DUP"
      number: 100
      length_ranges: [[1, 100]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Medium duplications (100-1000 bp)
    - type: "DUP"
      number: 50
      length_ranges: [[100, 1000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Large duplications (1-10 kb)
    - type: "DUP"
      number: 30
      length_ranges: [[1000, 10000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]
    
    # Very large duplications (10-100 kb)
    - type: "DUP"
      number: 15
      length_ranges: [[10000, 100000]]
      overlap_mode: "contained"
      overlap_region_type: ["chr19"]

# Optional: Set minimum distance between SVs to avoid overlap
min_intersv_dist: 50

# Generate only 1 FASTA file instead of hapA and hapB
haploid: True
