# =====================================================================================
# spec/parameters.yaml — RECONCILED PARAMETER SPECIFICATION
# 21-genome phylogenetic tumour simulation (1 germline root + 20 tumour leaves), HiFi reads.
#
# Written 2026-08-18 by the chief architect, from docs/01..06 INCLUDING their round-1
# referee critiques. This file supersedes spec/somatic.yaml where the two disagree
# (differences are listed under `risks.superseded`).
#
# CONTRACT OF THIS FILE
#   1. Every leaf value carries a sibling `source:` key. No number appears here that does
#      not appear in docs/01..06 (or is arithmetic on such numbers, tagged [COMPUTED]).
#   2. Where a referee corrected a number, the CORRECTED value is used and the correction
#      is named in the sibling `correction:` key.
#   3. Where sources disagree, the pick is stated with `range:` + `why:`.
#   4. Counts are either a distribution spec ({dist:, median:, iqr:}) or a fixed value
#      carrying `fixed_because:`.
#   5. Anything needed but unsourced is NOT guessed — it is in `risks.unknowns`.
#
# TAGS used in `source:`
#   [DOC n §x]      = docs/0n_*.md section x
#   [REF n Rx]      = docs/0n referee critique, item Rx / Bx / Mx
#   [MEASURED]      = measured on this box, file named
#   [COMPUTED]      = arithmetic on values above it, formula given
# =====================================================================================

meta:
  spec_version:
    value: "1.0"
    source: "this file, 2026-08-18"

  cancer_type:
    value: breast_carcinoma
    source: "[DOC 3 §1] chosen over HGSOC / melanoma / colorectal / GBM"
    why: |
      Breast is the only type where (a) the SV process is described down to the modal
      duplication/deletion size with a named mechanism, (b) three independent WGS cohorts
      of >=500 genomes exist to cross-check every number (Nik-Zainal 560; CUBRICS 1,364;
      PCAWG/Hartwig re-processed 201+776), and (c) burdens are mid-range.
      Operational bonus: snape's real-data arm is breast cell lines (HCC1395/1937/1954/HS578T).

  subtype:
    value: HRD_deletion_dominant_BRCA2_PALB2_like
    source: "[REF 3 R1.1] corrected"
    correction: |
      docs/03 §12 column A labelled this 'BRCA1-type HRD / TDP group 1 (~11 kb tandem dups)'
      while pairing it with a class mix that is 45.4% deletions <10 kb and only 14.3%
      duplications <10 kb. The referee measured the split per sample: only 16/55 (29%) of
      PCAWG HRD breast genomes are TD-dominant, and only 6/30 (20%) in the HRD-and-WGD
      stratum. The measured mix therefore describes the deletion-dominant ~71-80% majority.
      DECISION: keep the measured mix, relabel the phenotype to match it, and DROP the
      three TDP modal spans (11 kb / 231 kb / 1.7 Mb) — [REF 3 R1.2]: those define three
      mutually exclusive TDP groups with three different drivers and cannot coexist in one
      genome, and Li 2020's own finding is that TD size is unimodal WITHIN a patient.
    consequence: "somatic tandem-duplication length spectrum is now unsourced -> risks.unknowns.somatic_sv_length_spectrum"

  driver_context:
    value: TP53_mutant
    source: "[DOC 3 §6] Bielski 2018: WGD followed TP53 mutation in 97.3% of timeable cases"

  hr_wgd_stratum:
    value: "PCAWG breast, hr_status == HR_deficient AND whole_genome_duplication == True"
    n: 30
    source: "[REF 3 R2.2] re-derived from Martinez-Jimenez 2023 Suppl. T1+T5"
    correction: "docs/03 §12 quoted HRD-only medians (n=55), 45% of which are WGD-negative at median ploidy 1.74; pooling inflated every IQR"
    prevalence_note:
      value: "30/201 = 15% of PCAWG breast"
      source: "[REF 3 R3.4]"
      why: "this is a deliberately SV-rich 15% corner, NOT 'mid-range'. Stated, not hidden."

  germline_individual:
    id:
      value: HG00733
      source: "[MEASURED] activity_log 05:18:19; present in BOTH the 1kGP phased panel and the HGSVC3 65-sample callset"
      correction: "docs/02 §9.4/§11 were written for HG00096 (EUR/GBR, male); [REF 2 M8] required re-issue for the donor actually built"
    population:
      value: AMR / PUR
      source: "1kGP panel metadata [DOC 2 §0]"
    sex:
      value: female
      source: "[MEASURED] activity_log 05:18:19 — chrX het/nonref 0.87 vs father HG00731 0.00; chrY 0/128"
      consequence: "chrX is diploid; chrY is ABSENT from the reference and from every node"

  reference:
    build:
      value: T2T-CHM13v2.0 primary, chr1-22 + chrX
      path: /home/yuio/snape/simulation/phylo/ref/chm13.primary.fa
      source: "scripts/make_ref_chm13.sh, switched 2026-08-18; built from
                /home/datasets/references/genomes/chm13v2/chm13v2.0.nochr.fa"
      why: |
        SUPERSEDES the 2026-08-18 05:17 hg38 decision. That decision was made on ecosystem
        grounds (dbSNP/gnomAD/PCAWG/1kGP are hg38-native) and it was WRONG for a read
        simulator, because the simulated genome carries hg38's N blocks PHYSICALLY and
        badread reads from them. MEASURED on the hg38 build before the switch:
          - 86% of unmapped reads were poly-N
          - chr21: 15% of reads did not align (chr21 is 14.18% N)
          - non-N mean depth 18.57x against a 20x target
        Real sequencing produces no poly-N reads, so the artifact had no counterpart in
        the data being imitated. CHM13v2.0 is gapless (N = 0, measured), which removes it
        at the root. Centromere positions now come from the real censat v2.1 HOR
        annotation instead of hand-rounded coordinates.
      cost_accepted: |
        No CHM13 liftover chain in /home/datasets/references/liftover and no CHM13 build in
        SigProfilerMatrixGenerator. Neither is load-bearing here: signature work uses the
        COSMIC 96-channel probability matrices (channels, not coordinates) and the donor
        callset is taken from the HGSVC3 v1.0 T2T-CHM13 release, which publishes the same
        donor on both references.
    total_length_bp:
      value: 3054815472
      source: "[MEASURED] ref/chm13.primary.fa.fai, 23 contigs summed"
    n_bases:
      value: 0
      pct: 0.0
      source: "[MEASURED] 2026-08-20, N/n count over ref/chm13.primary.fa = 0"
    callable_length_bp:
      value: 3054815472
      source: "[COMPUTED] 3054815472 - 0 — gapless, so callable == total"
      used_for: "every fraction-of-genome quantity (LOH, density, depth gates) — [REF 2 B3], [REF 3 R2.8]"
      note: "scripts/refinfo.py is the single source of truth; nothing hardcodes this number"
    contigs_excluded:
      chrY:
        reason: "donor is female"
        source: "[REF 5 R10]"
      chrM:
        reason: "absent from ref/chm13.primary.fa.fai (23 contigs, chr1-22+chrX)"
        source: "[REF 2 R4.1], [REF 5 R9], [REF 6 R4.8] all flag this as a realism gap"
        status: "ACCEPTED DEVIATION -> risks.accepted_deviations.no_mitochondrion"
      alt_and_unplaced:
        reason: "primary-only subset; avoids the 170 non-primary contigs that accumulate _hapA suffixes and break UCSC-convention BEDs"
        source: "[REF 4 X7]"

  build_mode_germline:
    value: real_donor_copy
    source: "[DOC 2 §9.4] tiers 1-2; activity_log 05:39:02 (HGSVC3 build running)"
    why: |
      Copying a real individual's real phased calls makes every marginal AND every
      correlation (LD, ROH, recombination-linked density, repeat-context indel clustering,
      per-chromosome density) real by construction. Everything docs/02 §7-§8 proposes to
      MODEL (recombination-weighted intensity, ROH segment laydown) becomes unnecessary —
      and [REF 2 B4] and [REF 2 m4] showed both of those models were wrong as written.
    consequence: |
      Validation consequence [REF 6 R3.5]: G03/G04/G07/G08/G12 become SELF-CONSISTENCY
      checks (they catch a broken sampler, not an unrealistic model). Realism evidence must
      come from the independent axes: a HELD-OUT 1kGP sample comparison, ROH structure,
      and the HGSVC3-vs-panel cross-check. Labelled as such in `validation`.

