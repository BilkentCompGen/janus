      why_absent: "Nik-Zainal's 9/22/18/18/14/19% RS shares could not be verified from the primary text by either the author or the referee ([DOC 3 §15.7], [REF 3 R3.5]); the LINX taxonomy has no INV/TRA column at all"
      what_is_usable: "21.7% of breast SVs are distal-intrachromosomal or interchromosomal (Kim R. 2025), and unbalanced >> reciprocal (Li 2020) — rank order only"
    junction_microhomology_probabilities:
      what: "per-junction probability of blunt / 2-7 bp MH / 10-30 bp MH / templated insertion, and the insert length distribution"
      why_absent: "docs/03 §5 describes the modes qualitatively and never converts them to probabilities"
      source: "[REF 3 R4.3], [REF 6 R3.11]"
      blocks: "the realism of exactly the signal snape builds contigs from"
    somatic_snv_placement_covariates:
      what: "replication timing / chromatin / transcription-coupled-repair weights for somatic SNV density"
      why_absent: "docs/03 gives replication timing for SVs only"
      source: "[REF 3 R4.1]"
      consequence: "uniform placement gives a flat regional mutation density that no real tumour has and that any reviewer can test in one command"
    sv_breakpoint_placement_targets:
      what: "target fraction of somatic SV breakpoints in repeats / segdups / fragile sites"
      why_absent: "docs/06 asks for the CHECK; no doc supplies the TARGET. Only the fragile-site ~100 kb deletion peak exists."
      source: "[REF 3 R4.2]"
      consequence: "uniformly-placed breakpoints make the caller look better than it is — the dominant realism axis for a caller benchmark"
    homozygous_deletion_geometry:
      what: "size distribution of CN=0 segments"
      why_absent: "docs/03 gives the count (mean 2.0, never a whole arm) and no sizes"
      source: "[REF 3 R4.9]"
    kataegis_geometry:
      what: "foci per affected tumour, mutations per focus, focus span"
      why_absent: "Nik-Zainal gives prevalence only (49% >=1 focus, 4% >=10 foci)"
      source: "[DOC 3 §15.3]"
    driver_genotype:
      what: "WHICH TP53 mutation, where, and how BRCA1/2 is biallelically inactivated"
      why_absent: "docs/03 recommends the phenotype and budgets 4.6 drivers without naming a genotype"
      source: "[REF 3 R4.4]"
      note: "promoter methylation, one of the two documented BRCA1 routes, is unsimulatable in a sequence-only truth set — itself worth stating"
    clone_abundance_model:
      what: "clonal abundances for the 20 leaves, needed to compute the size-weighted J1c that Noble 2022's empirical range (0-0.5) is expressed in"
      why_absent: "docs/01 cites Laks (9 clones, 62-145 cells) and Salehi's abundance time series and then uses neither"
      source: "[REF 1 M4], [REF 1 MISSING-6]"
      consequence: "without it we cannot say whether '20 distinct leaves over superclones of size 8/6/4/2' is even a likely draw, and the null comparison silently assumes complete sampling"
    chrx_loss_rate:
      what: "rate of X-chromosome / Xi loss in breast carcinoma"
      why_absent: "docs/03 §11 handles chrX in a MALE leaf; the donor is female and the LOH/aneuploidy numbers quoted are autosomal"
      source: "[REF 3 R4.7]"
    cell_line_excess_burden:
      what: "the immortalised line's mutation excess over the founding tumour, accumulated in years of culture BEFORE the 20-clone experiment"
      why_absent: "docs/01 §5 covers within-line drift over 8-14 months but never adds this term"
      source: "[REF 1 MISSING-10]"
      consequence: "leaf burden is anchored to primary-tumour medians while the object simulated is not a primary tumour"
    post_wgd_rate_scaling:
      what: "how the per-genome mutation rate changes across the WGD boundary (twice the DNA per cell)"
      why_absent: "neither the scaling nor its interaction with the pre/post-WGD trunk split is given anywhere"
      source: "[REF 3 R4.5]"
    long_read_mei_per_genome:
      what: "per-genome Alu/L1/SVA counts at long-read sensitivity"
      why_absent: "no source states them; docs/02 §4's 1,500-2,500 Alu is a DERIVED scaling that [REF 2 M7] showed is invalid in principle"
      source: "[DOC 2 §13.1]"
      resolution_path: "count MEIs directly in the donor's HGSVC3 Mobile_Elements/ release"
    per_individual_tr_locus_count:
      what: "how many of the ~1.7 M tandem-repeat loci carry a non-reference allele in one genome"
      why_absent: "no retrieved source states it; docs/02 §5's >=0.5 M is a measured lower bound"
      source: "[DOC 2 §13.2]"

  accepted_deviations:  # known-unreal, deliberately chosen, must appear in the final report
    no_mitochondrion:
      what: "chrM is absent from the reference and therefore from every node and every read set"
      real_world: "a 30x HiFi library yields chrM at 100-1000x; a real genome carries ~30-50 homoplasmic differences from rCRS plus heteroplasmy; mtDNA is a standard clonal-lineage marker in tumour work"
      source: "[REF 2 R4.1], [REF 5 R9], [REF 6 R4.8]"
      why_accepted: "ref/chm13.primary.fa is cut to chr1-22+chrX; adding chrM means rebuilding the germline and the whole tree"
    leaves_are_perfectly_clonal:
      what: "each leaf is a single pure genome at purity 1.0"
      real_world: "a real 'clonal cell line' is a population with ~45% subclonal mutations and 22% of its genome under subclonal CN change (Ben-David 2018, 27 MCF7 strains / 916 CCLE lines)"
      source: "[DOC 3 §10]"
      why_accepted: "insilicoSV yields one genome per node; any subclonal VAF must be produced by MIXING READ SETS at Phase E ([REF 4 X5]), which is not in the current plan"
      partial_mitigation: "somatic.copy_number.subclonal_cn puts 22% of the genome under branch-level CN change, so the leaves are at least not CN-identical"
    no_purity_ladder:
      what: "no tumour-in-normal contamination and no non-100%-purity leaf"
      real_world: "purity and TiN are the two knobs that decide whether a somatic caller works"
      source: "[REF 6 R4.3]"
      note: "the CASTLE archive already on disk contains a ready-made HiFi purity ladder at 20/40/60/80% — it can be used as the comparator without simulating one"
    detected_not_true_burdens: {see: somatic.per_leaf_burden.detected_vs_true}
    badread_error_composition: {see: reads.known_deviations_from_real_hifi}

