      correction: |
        docs/02 §1.4 said '+8,600' (prose) and §11 row 1e said '+7,215' (table), both traced
        to TEL16's 8,579 novel-vs-a-2016-catalogue-across-all-classes. The right arithmetic is
        BB22's own: 7,473,575 novel-vs-dbSNP-b155 alleles x 92.7% singletons / 3,202 samples
        = 2,164 novel singletons per genome, plus a share of the 545,571 non-singleton novel
        alleles -> ~2,200-3,500. dbSNP b156 (the build on disk) is larger, so the true figure
        is at or below that.
      placement: "het only, same trinucleotide spectrum as the donor's own SNVs"

