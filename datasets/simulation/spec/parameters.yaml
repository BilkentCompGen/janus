      role: "cross-validation and the fallback if an HGSVC3 chromosome fails to import; NOT the primary truth"
      superseded_by:
        value: "[MEASURED] spec/measured_real_chm13.tsv — the SAME individual's real T2T-CHM13
                callset: SNV 3,761,943 + indel 993,207 + SV 22,589 = 4,777,739; het/hom 2.1782;
                Ti/Tv 2.0076; indel ins:del 0.9732; SV ins:del 1.0265"
        why: "the gates must ask 'does this match THIS individual on THIS build', not 'does it
              match a GRCh38 literature number'. The GRCh38-derived het/hom and SV ins:del bands
              were FAILING correct CHM13 data until they were re-derived (2026-08-19)."
    chrX:
