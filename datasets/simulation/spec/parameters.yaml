              references; the CHM13 flavour is the one imported, matching ref.build"
      source: "[DOC 2 §9.2] (file list + sizes HTTP-verified 2026-08-18); activity_log 05:18:19, 05:39:02"
      why: |
        [DOC 2 §3.1] the technology ladder is SENSITIVITY, not disagreement: the same samples
        give 19,297-23,969 SVs by long read and 8,540-9,963 by short read. Phase E emits HiFi
        reads, so the germline truth must be built at the long-read/assembly tier or the
        dataset is detectably unreal the moment a HiFi SV caller touches it.
        [REF 2 B2] additionally forbids mixing assembly-tier COUNTS with panel-tier SIZES —
        so the sizes come from the same file as the counts.
    cross_check:
      value: "[SUPERSEDED — GRCh38] /home/datasets/variants-population/1000genome/phased/ (1kGP high-coverage NYGC, shapeit4, GRCh38, chr1-22)"
