      correction: |
        docs/02 §11 specified 2.3 with a gate of 2.00-3.06, both taken from the SHORT-READ panel.
        A build that faithfully copies the real assembly genotypes FAILS that gate. The panel
        drops ~53% of SVs and the survivors are not a random subset.
    class_ordering_gate:
      value: "SNV < SV < INDEL"
      source: "[REF 2 B1] corrected"
      correction: "docs/02 §11 gated 'SNV < INDEL < SV'; at the assembly tier SV (1.85) sits BELOW indel (2.08)"
    ins_del:
      value: 1.665
      band: [1.50, 1.70]
      source: "[REF 2 R5] measured on HG00096 HGSVC3; [DOC 2 §3.5] LOG25 cohort 1.617 vs GRCh38"
      why: "GRCh38 is missing sequence relative to a typical human, so assembly calling recovers an insertion excess. LOG25's CHM13 comparison (1.003) proves the underlying biology is balanced."
      CORRECTED_FOR_CHM13:
        value: 1.0265
        band: [0.90, 1.20]
        source: "[MEASURED] spec/measured_real_chm13.tsv — HG00733's real T2T-CHM13 callset"
        why: |
          1.665 is a GRCh38 ARTEFACT, not biology: it counts the reference's missing sequence
          as donor insertions. CHM13 is complete, so that excess disappears and the ratio
          collapses to ~1.0 — exactly the 1.003 LOG25 predicted. Since the reference switched,
          the 1.50-1.70 band above is UNREACHABLE by correct data and must not be gated on.
          It FAILED the correct germline once (2026-08-19) before being re-derived.
        binding: "germline_gate.py G07b uses THIS band; the 1.665 above is kept only as the
                  GRCh38 record and drives nothing (build_mode_germline is real_donor_copy,
                  so the realized ratio is the donor's own)"
    size_spectrum:
      source: "[REF 2 B2] corrected — measured on HG00096's HGSVC3 calls, NOT on the panel"
      correction: "docs/02 §11 rows 3a/3b/3g quoted panel medians (DEL 314, INS 281) against an assembly-tier count; the real assembly spectrum is 2.2x smaller in DEL median and 3.7x larger at >=1 kb"
      del:  {p25: 73,  median: 141, p75: 328, p95: 2553, source: "[REF 2 B2]"}
