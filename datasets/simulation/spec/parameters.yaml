      phase: C
      source: "[DOC 2 §9.1, §13.4]"
      action: "download from the EBI 1000G FTP path recorded in docs/02 §9.1 (HTTP-verified 2026-08-18), or take chrX from HGSVC3 only"
    uncommitted_patches:
      what: "both insilicoSV patches are uncommitted; a re-clone or `pip install -e .` silently reverts them and every shared insertion becomes 1 bp with no warning"
      phase: "C and D"
      source: "[REF 4 MINOR]; docs/08"
      action: "commit them in the vendored tree and add a startup assertion (import a 10 bp INSSEQ, assert +10 bp) to the build scripts"
    disk_does_not_fit:
      what: "703 GB of 30x reads + ~2 TB of HiFi BAMs against 2.5 TB free"
      phase: E
      source: "[REF 5 R11] + [REF 6 R2.4]"
      action: "pick from reads.budget.disk.alignment_budget.mitigation_options BEFORE Phase E writes anything; enforce via D01-D03"
    missing_scripts:
      what: "scripts/rebin_hifi_q.py does not exist, and the five gate scripts referenced by docs/05 §11 live in /home/yuio/tmp (the box's declared throwaway directory)"
      phase: E
      source: "[REF 5 R12]"
      action: "write the re-binner (histogram-match, not nearest-level) and move realstats/errcomp/covprof/covprof2 into simulation/phylo/scripts/"
    tree_json_node_name_collision:
      what: "spec/tree.json's edges_in_units_of_S uses the label `scA` for all FOUR superclone stems (3 edges point INTO a node named scA, 6 edges point out of it). Any build step that constructs a graph keyed by node name will produce a cycle or silently merge branches."
      phase: B
      source: "[MEASURED] this review, on spec/tree.json"
      action: "re-emit spec/tree.json with unique stem names (scA/scB/scC/scD) before scripts/realize_tree.py consumes it; the 38 edge KEYS are distinct so no length information is lost"
    rtg_tools_missing:
      what: "G12, F02 and R06 all want rtg vcfeval; it is a single Java jar with no compilation"
      phase: "C/D/E"
      source: "[DOC 6 §11.6]"
      action: "install in Phase A, not at validation time; also `rtg format -o SDF ref.fasta` (docs/06 §6.2 passes -t SDF/ without ever creating it)"

  open:                # decided or decidable, but not yet closed
    tree_budget_sum_mismatch:
      what: "docs/01 §8.3's post-MRCA edge total is 5.444*S; spec/tree.json's is 5.2193*S — a 0.22*S (~2,000 SBS) gap"
      source: "[MEASURED] this review"
      resolution: "spec/tree.json is authoritative (independently recomputed at activity_log 05:16:06); the docs/01 table should be re-emitted from it"
    paf_insertion_nesting:
      what: "novel-insertion blocks have no PAF row, so a somatic event landing inside a germline insertion is unprojectable to reference coordinates by the PAF-composition route"
      source: "[REF 4 X2]"
      resolution: "route B (independent asm5 re-alignment + paftools call) covers it; the two routes are already required to agree, so a disagreement localises the problem"
    trunk_fraction_residual_disagreement:
      what: "docs/01 (0.55) vs docs/03 (0.80) — resolved in favour of 0.55, but on n=1 (Roerink P2)"
      source: "tree.branch_budget.trunk_fraction_snv"
      resolution: "recorded as a design choice with the full bracketing range; S05b reports the consequence in a comparable unit"
    error_model_generation:
      what: "pacbio2021 is 2021-era Sequel IIe; the length and Q-alphabet targets are 2024 Revio"
      source: "[REF 5 R7]"
      resolution: "declared as a deviation (reads.known_deviations_from_real_hifi.error_model_vintage). Closing it means retraining error+qscore models from the on-disk 600 MB Revio slice — the alignment machinery and the data are already here."
    real_read_divergence_anchor:
      what: "docs/05 §2.3's 0.27% Revio anchor was measured by aligning to hg38 with a HAND-ESTIMATED germline subtraction (~0.075%/haplotype; the standard figure is ~0.090%)"
      source: "[REF 5 R7]"
      resolution: "the reads are on disk — measure the germline load instead of assuming it, before quoting a target error rate"

  unknowns:            # needed, absent from ALL six docs, NOT guessed
    somatic_sv_length_spectrum:
      what: "per-class length distributions in base pairs for somatic DEL / TD / INV / TRA-partner distance"
      why_absent: "docs/03 §12 buckets everything as <10 kb / >=10 kb; the three TDP modal spans were dropped with the BRCA1-type label ([REF 3 R1.1/R1.2])"
