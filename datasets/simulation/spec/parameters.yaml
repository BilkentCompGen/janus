      source: "[DOC 3 §3] Priestley 2019 (Hartwig), verbatim-verified by [REF 3 R0]"
    spectrum_shift_along_the_tree:
      fraction_of_lineages: {value: 0.35, source: "[DOC 3 / DOC 1 §8.4] Gerstung 2020: shifts in 29%/30%/40% of samples"}
      absolute_change:      {value: 0.20, source: "Gerstung 2020: median 19%/21% absolute change"}
      mechanism_note: "[REF 1 MISSING-8]: Petljak's APOBEC bursts are EPISODIC and LINEAGE-PRIVATE (>100-fold between siblings of one parent), not a smooth trunk-to-branch gradient. Apply the shift as a per-lineage APOBEC (SBS2/SBS13) burst on selected branches."
    somatic_ti_tv:
      value: null
      status: "falls out of the 96-channel mix; computed at build time and reported, no independent target exists in any doc"
      source: "[REF 3 R4.12] flags PLAN.md's somatic Ti/Tv acceptance criterion as unsourced"

  sv_class_mix:
    unit: "clustered events; shares are of total events"
    stratum: "PCAWG breast HRD, n=55 (the HRD-and-WGD n=30 re-derivation gave totals only, not a class split)"
    source_all: "[DOC 3 §4b] Martinez-Jimenez 2023 Suppl. T5"
    del_lt_10kb:  {n: 139, frac: 0.454}
    del_ge_10kb:  {n: 29,  frac: 0.096}
    td_lt_10kb:   {n: 23,  frac: 0.143}
    td_ge_10kb:   {n: 39,  frac: 0.148}
    complex_lt_20_junctions: {n: 33, frac: 0.148}
    complex_ge_20_junctions:
      prevalence: 0.47
      conditional_count: {median_when_present: 1, max: 14}
      source: "[REF 3 R3.7] corrected"
      correction: "docs/03 §12 printed '0-2 (0.4% of events)', a zero-inflated median presented as a count. Measured: 47% of HRD breast genomes carry >=1, max 14 (66% across all breast)."
    line1_insertions: {n: 1, frac: 0.007}
    single_accounting_rule:
      value: "the trunk chromothripsis event IS the Complex >=20 cluster. It consumes that allocation and its junctions count toward the 393/273 totals."
      source: "[REF 3 R1.3] corrected"
      correction: "docs/03 §12 listed 'complex clusters >=20' and 'chromothripsis: 1 event, 26 SVs' as separate rows. In the LINX taxonomy they are the same physical object; as written a leaf got both and blew past the junction budget."
    exhaustiveness_note:
      value: "for all 55 HRD breast samples, Del<10k + Del>=10k + Dup<10k + Dup>=10k + Complex<20 + Complex>=20 + LINE equals 'Total no. of SVs' EXACTLY, residual 0.0 on every row"
      source: "[REF 3 R1.4] measured"
      consequence: "LINX folds inversions, reciprocal and unbalanced translocations into 'Complex'. There is no INV or TRA column to read, so those classes must be sourced from outside this taxonomy (below)."
    inversions:
      policy: "not an independent class; small reciprocal inversions travel with <50 kb deletions and large ones with >500 kb deletions; simple inversions are uncommon"
      source: "[DOC 3 §5c / §12] Li et al. 2020"
      unallocated_flag: "[REF 3 R1.4]: Nik-Zainal 2016 reports RS6 (inversions) = 19% and RS4 (translocations) = 18% of all rearrangements in 560 breast genomes, i.e. 37% of the rearrangement load is unallocated by the LINX mix. Those percentage shares are UNVERIFIED ([DOC 3 §15.7], [REF 3 R3.5]) -> risks.unknowns.inv_tra_shares"
    translocations:
      distal_or_interchromosomal_share_of_svs:
        value: 0.217
        source: "[DOC 3 §4c] Kim R. et al. 2025, 1,364 breast WGS: 45,266/208,540; local intrachromosomal <5 Mb = 78.2%"
      reciprocal_vs_unbalanced:
        value: "rank order only — unbalanced translocations form their own signature; reciprocal translocations and reciprocal inversions are uncommon"
        source: "[DOC 3 §5] Li et al. 2020"
        status: "no numeric split in any doc -> risks.unknowns.inv_tra_shares"
    length_spectrum_within_class:
      value: null
      status: UNSOURCED
      source: "[REF 3 R1.5] — the budget is bucketed <10 kb / >=10 kb only; insilicoSV needs a length distribution per class"
      what_is_known:
        - {value: "fragile-site deletion size peak ~100 kb", source: "[DOC 3 §5] Li et al. 2020"}
        - {value: "deletion and TD size distributions are multimodal ACROSS a cohort but UNIMODAL WITHIN one patient", source: "[DOC 3 §5] Li et al. 2020"}
      goes_to: risks.unknowns.somatic_sv_length_spectrum
    breakpoint_junction_structure:
      microhomology_modes:
        - {value: [2, 7],  mechanism: MMEJ,      source: "[DOC 3 §5] Li et al. 2020, bimodal"}
        - {value: [10, 30], mechanism: "SSA / MMBIR", source: "[DOC 3 §5]"}
        - {value: 0, mechanism: NHEJ, note: "a large fraction has none", source: "[DOC 3 §5]"}
      per_junction_probabilities: {value: null, status: UNSOURCED, goes_to: risks.unknowns.junction_microhomology_probabilities}
      why_it_matters: "[REF 6 R3.11]: if every junction is blunt, every junction is perfectly assemblable and R07's recall gate becomes meaningless — this is the exact signal snape builds contigs from"

  copy_number:
    wgd:
      count: {value: 1, fixed_because: "one WGD is typical for this stratum", source: "[DOC 3 §6] PCAWG breast 50%, Hartwig breast 56%"}
      where: trunk
      at_fraction_of_trunk_molecular_time:
        value: 0.84
        ci: [0.808, 0.876]
        source: "Roerink 2018 patient P2, bootstrap x10,000 [DOC 1 §3]"
        correction: "docs/01 §8.4 and spec/somatic.yaml rounded this to 0.80; the measured value is 0.84 (formula (180x2)/(180x2+67), the x2 correcting for allele loss in 2+0 regions — [REF 1 R0] required the formula be written out)"
        ordering: "WGD follows the TP53 mutation in 97.3% of timeable cases (Bielski 2018 [DOC 3 §6]); WGD events have an intermediate ranking overall (Gerstung 2020 [DOC 1 §3])"
      subclonal_wgd: {value: 0, source: "[DOC 1 §8.4] TRACERx421: 19% of tumours have >=1 subclonal WGD — a legitimate but secondary option; not used"}
      multiplicity_consequence:
        value: "trunk mutations arising BEFORE the WGD (0.84 of the trunk = ~4,153 SBS) sit at multiplicity 2; post-WGD trunk mutations at multiplicity 1"
        source: "[REF 1 M11] + [REF 3 R2.6]; count [COMPUTED] 0.84 x 4944"
        vaf_consequence: "at CN 4: m=2 -> VAF 0.50, m=1 -> VAF 0.25. WGD alone does not change VAF. [DOC 3 §11]"
    post_wgd_loss:
      value: REQUIRED
      source: "[REF 1 M11] corrected"
      correction: "docs/01 placed the WGD and stopped. With CN = contig count (docs/07 §1), a trunk WGD with no subsequent chromosome loss leaves every leaf at 4n — doubling every genome and its read requirement. The chromosome-loss process that walks 4n back to the target ploidy is mandatory."
    leaf_ploidy:
      value: 2.97
      iqr: [2.83, 3.39]
      source: "[REF 3 R2.3] corrected — PCAWG breast, HRD AND WGD+, n=30"
      correction: "docs/03 §12 anchored ploidy to a CELL-LINE proxy ('breast cell lines median 2.93', Cell Model Passports n=52). The exact stratum number was already in hand. The proxy landed in the right place by coincidence; without the HRD filter it would have been 0.3 ploidy units low (PCAWG breast WGD+ overall is 3.25, IQR 2.96-3.70)."
    cn_segments_per_leaf: {dist: {median: 88, iqr: [43, 160]}, p05: 29, p95: 310, source: "[DOC 3 §6] Steele 2022, PCAWG WGS n=512"}
    loh_fraction_autosomal:
      dist: {median: 0.185, iqr: [0.086, 0.340]}
      p05: 0.018
      p95: 0.524
      source: "[DOC 3 §6] Martinez-Jimenez 2023 Suppl. T2, PCAWG breast"
      cross_check: {value: 0.23, what: "Hartwig pan-cancer mean", source: "Priestley 2019"}
      unit: "fraction of meta.reference.callable_length_bp"
    aneuploidy_score_arm_events: {dist: {median: 19, iqr: [10, 30]}, p95: 36, source: "[DOC 3 §6] PCAWG breast"}
    arm_gain_burst:
      value: "the majority of arm-level gains are placed in ONE trunk event, each incrementing allele-specific CN by exactly +1"
      source: "[DOC 1 §3] Gerstung 2020: 57% (468/815) of informative near-diploid tumours show synchronous gains, 61% more frequent than chance (P<0.01); 80-90% of arm gains are +1"
    homozygous_deletions:
      count: {value: 2, source: "[DOC 3 §6] Priestley 2019 mean 2.0 gene-level events"}
      constraint: "never a whole autosomal arm (Priestley: 'not a single example... of a complete autosomal arm')"
      size_distribution: {value: null, status: UNSOURCED, goes_to: risks.unknowns.homozygous_deletion_geometry}
    subclonal_cn:
      value: ENABLED
      source: "[REF 3 R4.6]"
      target_genome_fraction_under_branch_level_cn: {value: 0.22, source: "[DOC 3 §10] Ben-David 2018: median 22% of the genome affected by subclonal CN events across 916 CCLE lines"}
      source_of_requirement: "[REF 3 R4.6] — docs/03 §12 assigned ALL copy-number structure to the trunk; 20 CN-identical leaves is precisely the 'the leaves came out too clean' failure the mandate warns about"
      placement: "on superclone stems, so several leaves share each event (also supplies the mutation-loss mechanism of tree.branch_budget.mutation_loss_by_subclonal_deletion)"
    loh_placement_on_the_tree:
      value: "a mixture of trunk LOH (the bulk of the 18.5%) and superclone-stem LOH"
      source: "[REF 1 MISSING-5] — which branch an LOH arises on is a tree question, and it determines which leaves show germline heterozygous variants going homozygous (the user's named failure mode)"
    chrx_in_a_female_tumour:
      value: "X-chromosome loss / Xi loss is a common breast-carcinoma event and is NOT covered by the autosomal LOH/aneuploidy numbers above"
      source: "[REF 3 R4.7]"
      status: "no sourced rate -> risks.unknowns.chrx_loss_rate"

  complex_events:
    chromothripsis:
      count: {value: 1, source: "[DOC 3 §7a] breast-AdenoCA high-confidence prevalence 48.9% (93/190 donors); decision recorded: include one"}
      where: "trunk, before the MRCA"
      source_placement: "[DOC 1 §8.4] Cortes-Ciriano 2020; a single catastrophic early event"
      geometry:
        region_mb:       {dist: {median: 56.6, iqr: [27.8, 98.4]}, p95: 162.8, source: "[DOC 3 §7b] breast, 156 HC regions / 93 donors"}
        n_svs:           {dist: {median: 26, iqr: [13, 43]}, p95: 141, max: 351, source: "[DOC 3 §7b]"}
        n_cn_segments:   {dist: {median: 30, iqr: [16, 52]}, source: "[DOC 3 §7b]"}
        n_chromosomes:   {value: {1: 0.59, 2: 0.23, "3-4": 0.18}, source: "[DOC 3 §7b] breast donor counts 55/21/9+8"}
        oscillation_rule: {value: ">60% of CN segments oscillating between TWO CN states, across >=7 adjacent segments (high-confidence definition)", source: "[DOC 3 §7b]"}
      ordering_vs_wgd:
        value: "chromothripsis is placed BEFORE the WGD on the trunk"
        source: "[REF 1 M11] required the order be stated — chromothripsis before vs after WGD produces different CN states from the same breakpoint set"
        rationale: "Gerstung 2020 ranks WGD as an intermediate event and TP53 among the earliest; the chromothripsis-TP53 association is strong (pan-cancer OR 3.22) [DOC 3 §7c]"
    kataegis:
      prevalence: {value: 0.49, source: "[DOC 3 §7c] Nik-Zainal 2016: 49% of 560 breast cancers had >=1 focus; 4% had >=10 foci"}
      character: {value: "clustered APOBEC C>T / C>G at TpC", source: "[DOC 3 §7c] 81.7% of kataegis mutations carry the APOBEC signature (PCAWG)"}
      geometry: {value: null, status: UNSOURCED, goes_to: risks.unknowns.kataegis_geometry}
      co_localisation: "kataegis co-localises with clustered rearrangements — it is the one SNV feature that interacts with SV placement"
    chromoplexy: {decision: EXCLUDE, prevalence: 0.178, source: "[DOC 3 §7c] PCAWG 467/2,613; prominent in prostate/lymphoid/thyroid, not a breast-enriched process"}
    ecdna:       {decision: EXCLUDE, prevalence_pan_cancer: 0.143, source: "[DOC 3 §7c] Kim H. 2020", why: "breast-specific frequency is UNSOURCED ([DOC 3 §15.1]) and ecDNA needs a separate copy-number architecture"}
    bfb_foldback: {decision: EXCLUDE, source: "[DOC 3 §15.2] per-tumour fold-back inversion count is UNSOURCED; a candidate figure found in search could not be located in either primary paper and was discarded"}

  drivers:
    truncal: {value: 4, source: "[DOC 1 §8.4] Frankell 2023 TRACERx421 mean 4.2 truncal"}
    subclonal: {value: 3, source: "[DOC 1 §8.4] Frankell 2023 mean 2.8 subclonal"}
    cross_check: {value: 4.6, what: "PCAWG pan-cancer drivers per tumour (2.6 coding point drivers); 91% of tumours have >=1", source: "[DOC 3 §12]"}
    clonality_check: {value: 0.090, what: "fraction of SNV/indel drivers that are subclonal", source: "[DOC 3 §9] Dentro 2021: 357/3,933"}
    gene_identities: {value: null, status: UNSOURCED, goes_to: risks.unknowns.driver_genotype}

  zygosity_and_vaf:
    architecture_rule:
      value: "every somatic mutation is written to ONE haplotype/copy contig -> structurally heterozygous. pick_genotype is never called."
      source: "docs/07 §1; experiments/01 (insilicoSV's random placement is P(hom)=0.5 fixed, variant_set.py:455 — a disaster for somatic zygosity)"
    homozygous_only_via: "LOH or homozygous deletion, i.e. loss of the opposite copy — the real mechanism"
    vaf_formula:
      value: "VAF = m*rho / (rho*CN_T + (1-rho)*CN_N); at rho=1 this collapses to VAF = m/CN_T"
      source: "[DOC 3 §11] Dentro 2021 STAR Methods"
      purity: {value: 1.0, fixed_because: "each leaf is a pure clonal cell line; no stromal contamination", source: "[DOC 3 §10-11]"}
    targets:
      vaf_eq_1_fraction: {value: [0.10, 0.20], source: "[DOC 3 §11] derived from 18.5% LOH x the pre/post-LOH split"}
      het_fraction:      {value: ">= 0.60", source: "[DOC 6 §4.1 S04]"}
      hom_fraction:      {value: "<= 0.35, and >= 80% of those inside declared LOH/CN-loss intervals", source: "[DOC 6 §4.1 S04]"}
      dominant_mode:     {value: "1/ploidy", source: "[DOC 3 §11]"}
      correction: |
        [REF 3 R2.6]: docs/03 §11 stated '~80-90% should show VAF ~ 1/CN' while its own cross-check
        (c) correctly says pre-WGD trunk mutations carry multiplicity 2. With a trunk WGD and 55%
        of SBS on the trunk, a large share of somatic SNVs sits at m=2 (VAF ~ 2/CN). The corrected
        statement is: the VAF histogram is MULTI-MODAL — a mode at m/CN for each realised
        multiplicity, a secondary mode at 1.0 concentrated inside LOH segments, and ZERO somatic
        SNVs inside CN=0 segments.
    forbidden_outcomes:
      - {value: "all-heterozygous", source: "[DOC 3 §11]"}
      - {value: "all-homozygous (the user's named failure mode)", source: "PLAN.md §1"}

  germline_somatic_collision:
    expected_collisions:
      value: 63
      source: "[COMPUTED] germline density 1 SNV per 823 bp x 51,865 distinct somatic sites over 2.9006 Gb; [REF 1 MISSING-7] computed ~64 at S=8,750"
      about_half_on_the_same_haplotype: true
    why_it_is_a_blocker:
      value: "insilicoSV REJECTS overlapping imported variants (simulate.py:820), so a collision aborts a node build or silently produces a tri-allelic site the truth VCF cannot express"
      source: "[REF 1 MISSING-7]; activity_log 04:59:20"
    rule:
      value: "somatic sites are drawn EXCLUDING every germline variant position (both haplotypes), and the exclusion count is reported per node"
      source: "design decision forced by the above; [REF 6 R4.12] also requires the check"

# =====================================================================================
engine:            # how germline and every somatic node are MATERIALISED (insilicoSV)
# =====================================================================================
  tool:
    value: "insilicoSV v0.1.9, vendored at /home/yuio/snape/lib/insilicoSV, git 4dc1bae + 2 local patches"
    source: "[DOC 4 header]; upstream paper Battistella et al., Bioinformatics 2025;41(11):btaf594"
  required_patches:
    - id: patch1
      what: "imported INS sequences were truncated to their FIRST BASE, silently"
      where: "variant_set.py, grammar_to_variant_set call: pass [insseq], not insseq"
      source: "[DOC 4 §9 bug 1]; docs/08 §1; measured 10 bp INSSEQ -> +1 bp before, +10 bp after"
      impact_if_lost: "every shared insertion in the whole tree becomes 1 bp with no warning"
    - id: patch1b
      what: "imported SVs carried GRAMMAR='' so output_adjacencies: True crashed after all output was written"
      where: "variant_set.py: assign parent_info['GRAMMAR'] AFTER the SV_KEY derivation"
      source: "[DOC 4 §9 bug 1b]; docs/08 §2"
    - warning:
        value: "both patches are UNCOMMITTED in the working tree; one `pip install -e .` reverts them"
        source: "[REF 4 MINOR]"
        goes_to: risks.blockers.uncommitted_patches
  known_bugs_worked_around:
    snp_import: {value: "SVTYPE=SNP in an imported VCF crashes; omit SVTYPE for SNP records (REF/ALT single bases are auto-detected)", source: "[DOC 4 §9 bug 2] — present in BOTH pristine and patched trees"}
    snp_genotype: {value: "in a default diploid run 36% of SNPs are written GT 1|1 with TWO different ALTs (should be 1|2)", source: "[DOC 4 §4.4] measured 108/300", fix: "post-hoc truth-VCF rewrite GT 1|1 + 2 ALTs -> GT 1|2 — NOT by forcing homozygous_only, see haploid_mode_rule"}
    mcnv: {value: "mCNV crashes unless n_copiesB is given explicitly", source: "[DOC 4 §9 bug 4]"}
    output_svops_bed: {value: "crashes with KeyError SVTYPE; leave off", source: "[DOC 4 §9 bug 5]"}
    stats_txt: {value: "sim.stats.txt reports every SV as UNKNOWN; parse sim.vcf instead", source: "[DOC 4 §9 bug 8]"}
    whole_chromosome_mode: {value: "consumes the entire contig from the free tree; never mix with ordinary SV sets in one run — chain them", source: "[DOC 4 §9 bug 10]"}
  haploid_mode_rule:
    value: "haploid:True / homozygous_only:True is used ONLY at post-germline somatic levels applied to a cat'ed 2N genome, where 'haploid' means one contig per homolog. It is NEVER used for the germline import."
    source: "[REF 4 B4] corrected"
    correction: |
      docs/04 recommendation 4 said keep EVERY level haploid. Applied to the germline import that
      silently drops the donor's 2,742,284 heterozygous records (imported het records appear in the
      VCF and are never applied to the FASTA — docs/04 §6 measured this) and yields het/hom = 0:
      verbatim the 'Aaa tum mutasyonlar homosigot olmus' outcome the mandate forbids.
    somatic_heterozygosity_comes_from: "WHICH of the two homologous contigs an event lands on"
  phase_fidelity:
    value: "imported GT allele ORDER is honoured literally; phase is preserved exactly"
    source: "[REF 4 M1] corrected (docs/04 §7 wrongly said 'het with a random haplotype'); measured 60/60 at activity_log 04:54:47 and again by the referee at 3 seeds"
    why_it_matters: "this is what makes the real-donor-copy germline viable at all"
  spectrum_free_warning:
    value: "insilicoSV's type:SNP generator emits Ti/Tv = 0.4996 (uniform over the 3 non-reference bases, utils.py:62-64) — the signature of random sequencing error"
    source: "[REF 4 B1] measured, n = 251,327"
    consequence: "NO SNV field in this project may be generated that way. Germline and somatic SNVs both arrive through `- import:`."
  n_content_threshold:
    value: "[MOOT ON CHM13 — N = 0, no threshold can be exceeded] th_proportion_N must be raised for chromosome/arm-scale sets, or arm ROIs defined on ungapped intervals with overlap_mode: contained"
    source: "[REF 4 B5] — 9 of 24 hg38 chromosomes exceed the 0.05 default (chr1 7.4%, chr9 12.0%, chr13 14.3%, chr14 15.4%, chr15 17.0%, chr16 9.4%, chr21 14.2%, chr22 22.9%, chrY 53.8%)"
    on_chm13: "the whole class of failure below is gone: CHM13v2.0 is gapless, so no ROI can be
               rejected for N content and no run can die on an interspersed N. The N screen in
               scripts/vcf_to_insilicosv.py is kept (it costs nothing and guards the REF check)."
    already_hit: "experiments/04 — single interspersed N bases outside the big gaps killed whole chr2/chr3 runs; scripts/vcf_to_insilicosv.py now screens N context AND checks REF against the reference"
  contig_naming:
    value: "contig names gain a _hapA suffix per generation (chr1 -> chr1_hapA -> chr1_hapA_hapA); strip back to the canonical name after every level and re-faidx"
    source: "[DOC 4 §6]; verified activity_log 05:48:10"
  coordinate_projection:
    value: "a node's VCF is in its PARENT's coordinate space. Two independent routes to REFERENCE coordinates (ref/chm13.primary.fa) are built and REQUIRED to agree: (A) compose the per-level sim.hapX.paf chain; (B) re-align the leaf genome to the reference with minimap2 -x asm5 and call variants from scratch with paftools.js."
    source: "docs/07 §2; [DOC 4 §5.1, §5.3]"
    known_hole: {value: "novel-insertion blocks have NO PAF row, so a somatic event landing inside a germline insertion is unprojectable by route A", source: "[REF 4 X2]", goes_to: risks.open.paf_insertion_nesting}
  truth_identity:
    value: "every mutation carries a STABLE UUID assigned in mutations.tsv and written to the VCF ID field; identity is NEVER re-derived from coordinates"
    source: "[REF 6 R2.2] — coordinates shift after every indel/SV on the path, so coordinate-keyed set comparison fails at node 2"

# =====================================================================================
reads:
# =====================================================================================
  simulator:
    value: "Badread v0.4.2 (vendored, lib/Badread, git 4deb15b), --error_model pacbio2021 --qscore_model pacbio2021"
    source: "[DOC 5 §4] decision against PBSIM3"
    why: |
      PBSIM3 ships NO HiFi error model (RSII/SEQUEL CLR + ONT only); HiFi would require piping
      multi-pass CLR through PacBio `ccs`, which is not installable here (no conda) and is itself
      the expensive step. PBSIM3's own paper measures its best HiFi configuration at 0.34-0.53%
      total error against real 0.25% — worse than Badread, and it credits Badread with better
      homopolymer realism.
    invocation: "lib/Badread/venv/bin/python3 -m badread  (the venv console script has a stale /home/yuio/svp/ shebang and cannot run — [DOC 5 §10.1])"
  flags:
    identity:
      value: "28.3,3"
      objective: "MATCH THE DELETION ERROR RATE"
      source: "[REF 5 R8] corrected"
      why: |
        --identity in 2-value form is a NORMAL OVER READ Q-SCORE, and it scales total error only:
        the substitution:insertion:deletion mix is baked into the pacbio2021 7-mer table and is
        NOT tunable ([DOC 5 §3.2], measured across 30/27/26). No single value can match more than
        one error class, so the objective must be named. For a somatic SV/indel caller the error
        class that manufactures false calls is the DELETION rate, and deletions are the class
        Badread over-produces. 28.3,3 gives deletion 0.135% (real: 0.130% CHM13 / 0.141% Revio).
      alternatives_recorded:
        - {value: "27,3",   matches: "TOTAL error 0.25%", source: "[DOC 5 §9.1] main-text recommendation"}
        - {value: "25.4,3", matches: "INSERTION rate 0.093%", source: "[REF 5 R8]"}
        - {value: "30,3",   matches: "comparability with the existing snape benchmark", source: "[DOC 5 §12.1]"}
      derived_totals:
        median_read_identity: {value: 0.998521, source: "[COMPUTED] 1 - 10^(-28.3/10)"}
        mean_read_identity:   {value: 0.998122, source: "[COMPUTED] 1 - exp(-mu*ln10/10 + (sigma*ln10/10)^2/2), the closed form of [DOC 5 §1.2]"}
        expected_total_error: {value: 0.00186, source: "[REF 5 R8] deletion-matched row"}
    length:
      value: "17000,4400"
      source: "[DOC 5 §2.1] measured on real Revio SRR28305160: mean 17,075 / sd 4,367 (N50 17,654); the 10-run CASTLE cohort spans 10.8-17.6 kb mean"
      correction: "the project's previous 15000,4000 yields mean 14,913 / N50 15,667 — ~12% short of the runs snape is benchmarked against"
      caveat: "gamma skew 0.518 vs real 0.608 — as close as Badread's gamma can get [DOC 5 §2.1]"
    junk_reads:    {value: 0, source: "[DOC 5 §9.1] HiFi requires >=3 subread passes plus CCS consensus; no source reports a nonzero junk rate for HiFi"}
    random_reads:  {value: 0, source: "[DOC 5 §9.1] same reasoning"}
    chimeras:      {value: 0, source: "[DOC 5 §9.1]", caveat: "the per-read chimera rate for human HiFi WGS is UNSOURCED (12 searches). 0 avoids baking an invented rate into the primary dataset; an explicitly labelled sensitivity arm is the alternative."}
    glitches:      {value: "0,0,0", source: "[DOC 5 §9.1] glitches model ONT signal dropouts; CCS removes them"}
    start_adapter: {value: "0,0", source: "[DOC 5 §9.1] real HiFi carries adapter in <=0.25% of reads (Sim et al. 2022) and every production pipeline runs HiFiAdapterFilt"}
    end_adapter:   {value: "0,0", source: "[DOC 5 §9.1]"}
    seed:          {value: "deterministic function of (node, contig, copy); MUST be unique per shard or shards duplicate each other's reads", source: "[DOC 5 §1.2]"}
    defaults_warning:
      value: "Badread's DEFAULTS (--identity 95,99,2.5 beta, adapters on 90%/50% of reads, 1% junk, 1% random, 1% chimeras, glitches 10000,25,25) would fail the error and provenance gates outright"
      source: "[REF 6 R3.7]"

  depth_plan:
    definition:
      value: "depth D means D reads covering each position of the HAPLOID REFERENCE, not D x the input FASTA"
      source: "docs/07 §4 (bold: 'bu carpani ters cevirmek klasik bir hatadir'); [REF 5 R2]"
    per_shard_quantity_formula:
      value: "bases_shard = D * R * len(shard) / T   where R = reference length, T = that node's total FASTA length"
      source: "[REF 5 R2] corrected"
      correction: |
        docs/05 §9.1 hard-coded '--quantity 15x' per haplotype shard while §6 asserted the read
        requirement is independent of ploidy. Both cannot be true: Nx is N x the length of the
        FASTA you hand it (simulate.py:55). With a flat 15x per contig, a WGD leaf at ploidy 2.93
        is sequenced to 44x genome-average, not 30x — +44% bases and +44% disk (2,439 GB
        as-emitted, which does not fit the 2.5 TB free).
      worked_values:
        germline_diploid:   {per_copy_depth: 15.00, source: "[COMPUTED] 30 x R / 2R"}
        leaf_at_ploidy_2p97: {per_copy_depth: 10.10, source: "[COMPUTED] 30 x R / (2.97 R)"}
    stage_1:
      depth: 15
      bases_per_genome_gbp: {value: 45.47, source: "[COMPUTED] 15 x 3,031,042,417"}
      bases_total_gbp:      {value: 954.8, source: "[COMPUTED] x 21 nodes"}
    stage_2:
      depth: 30
      method: "generate a SECOND, INDEPENDENT 15x set with different seeds and concatenate"
      source: "[DOC 5 §8] — Badread coverage is Poisson (measured interior CV 0.0404 vs Poisson 0.0370), so the union of two independent 15x runs IS a 30x run"
      why: "nothing is wasted and a partial/failed run is never thrown away; there is a valid dataset at every moment"
      bases_per_genome_gbp: {value: 90.93, source: "[COMPUTED]"}
      bases_total_gbp:      {value: 1283.0, source: "[COMPUTED] 21 x 20 x 3.0548 Gb — ACTUAL run: 20x, CHM13 primary"}
      correction: "docs/05 used 3.117 Gb (CHM13 including chrY/chrM) -> 1,963.9 Gbp. The build in
        use is CHM13 primary chr1-22+chrX = 3.0548 Gb and the depth actually run is 20x, not 30x
        (user decision: 30x is overkill), giving 21 x 20 x 3.0548 = 1,283.0 Gbp.
        docs/06 §0's '630 Gbp' is wrong by 3.0x ([REF 6 R2.4])."
      measured: "[MEASURED] germline 61,098,676,413 bases = 20.00x; T01/T02/T03 all 20.00x"
    reads_count: {value: "111.8 M at 30x, 55.9 M at 15x", source: "[COMPUTED] at 17,075 bp mean"}

  sharding:
    unit:
      value: "(node, contig, copy) — one Badread process per contig-copy. NEVER split a chromosome."
      source: "[DOC 5 §5.2]"
      why: |
        The previous script split the reference into THREADSx8 chunks = 192 artificial contig ends
        per genome. Measured ([DOC 5 §5.1]): each boundary produces a ~30 kb coverage ramp bottoming
        at ~50% of interior depth, ZERO reads spanning the boundary, and truncated reads — i.e. 192
        loci per genome that look exactly like a breakpoint to a somatic SV caller, ~4,000 across
        21 genomes. This must not survive into the dataset.
    enumeration:
      value: "from each node's OWN .fai under the declared sex — never from a constant contig count"
      source: "[REF 5 R10] corrected"
      correction: "docs/05 §9.2's '21 x 2 haplotypes x 25 contigs = 1,050 units' puts chrX AND chrY in both haplotypes, i.e. an XXYY genome. Donor is female: chrX x2, no chrY. Node ploidy also changes the copy count after WGD."
    natural_ends: {value: "chromosome ends still ramp, and that is CORRECT — real telomeric coverage falls off and truth evaluation excludes the terminal read-length", source: "[DOC 5 §5.2]"}
    concurrency: {value: 24, source: "PLAN.md §4.8 — 32 cores shared with other users"}
    peak_rss_per_shard: {value: "~180 MB + 16.5 MB per Mb of reference; chr1 (248 Mb) ~4.3 GB; 24 concurrent chr1-sized shards ~100 GB — stagger process starts", source: "[DOC 5 §5.3] measured"}

  postprocess:
    quality_rebinning:
      value: "HISTOGRAM-MATCH the base-Q string onto the measured real-Revio frequencies {Q40 78.12%, Q35 10.70%, Q27 3.63%, Q22 2.75%, Q17 2.37%, Q10 1.77%, Q3 0.65%}"
      source: "[REF 5 R4] corrected"
      correction: |
        docs/05 §9.3 proposed nearest-level mapping. Measured on the doc's own re-binned file that
        gives Q40 = 96.92% (real: 78.12%) and a Q-string implying 99.892% per-base accuracy against
        the real 99.414% — 5x too optimistic, and the doc's own gate ('exactly the 7 levels, max
        Q40') passes on it. Corroborating tell: the 'realistic' file is 25% MORE compressible than
        real Revio.
      why_at_all: "Badread emits 92 distinct Q values up to Q93 with 59% of bases at Q93; modern Revio is binned to 7 levels capped at Q40 ([DOC 5 §3.3] measured). Anything BQ-aware (DeepVariant, samtools/pbmm2 filters, hifiasm) sees an alien distribution."
      script: {value: "scripts/rebin_hifi_q.py", status: "DOES NOT EXIST YET", source: "[REF 5 R12]", goes_to: risks.blockers.missing_scripts}
      residual_miscalibration:
        value: "at 28.3,3 the FASTQ Q string will still overstate accuracy (measured +3.9 Q at 27,3, i.e. 2.5x in error probability); the qscore model is a fixed CIGAR-context table trained on ~Q30 reads"
        source: "[REF 5 R5]"
        fix_path: "train a qscore model from the on-disk 600 MB Revio slice with `badread qscore_model` — the same alignment also retrains the error model"
    compression: {value: "pigz -6 -p2 in the pipe", source: "[DOC 5 §9.1]", caveat: "[REF 5 R14] 24 shards x pigz -p2 = 48 threads on a 24-core plan; account for it"}

  budget:
    throughput:
      value: 3.50
      unit: "Mbp/s aggregate on 24 cores"
      source: "[REF 5 R6] corrected"
      correction: "docs/05 §8's 3.89 Mbp/s was measured at 30,3 / 15000,4000 — the parameters the doc then rejects. At the recommended settings edlib does more work and throughput is ~10% lower (measured 0.304-0.311 vs 0.337-0.341 Mbp/s single-core)."
    wall_time:
      stage_1_15x: {value: 75.8, unit: hours, source: "[COMPUTED] 954.8 Gbp / 3.5 Mbp/s"}
      stage_2_30x_cumulative: {value: 151.6, unit: hours, source: "[COMPUTED] 1909.6 Gbp / 3.5 Mbp/s"}
      note: "6.3 days at 30x, inside the user's stated '1 hafta hatta 10 gun' tolerance. docs/05 §0's '2.9 d / 5.8 d' headline predates both corrections."
    disk:
      free_now: {value: "2.5 TB on /home", source: "[DOC 5 §0] measured"}
      fastq_gz_rebinned: {stage_1: "352 GB", stage_2_total: "703 GB", source: "[COMPUTED] at 0.3684 B/base measured [DOC 5 §7]"}
      fastq_gz_as_emitted: {value: "1,644 GB at 30x", source: "[COMPUTED] at 0.8608 B/base", note: "this is why re-binning is not optional"}
      raw_fastq: {value: "3,946 GB at 30x — DOES NOT FIT", source: "[DOC 5 §7]"}
      svb_2bit: {value: "491 GB at 30x", source: "[DOC 5 §7] 0.2503 B/base measured", decision: "NOT the default — .svb discards the Badread truth header (contig/strand/coords/identity), which is the only free per-read ground truth, and locks the reads to snape"}
      alignment_budget:
        value: "~2 TB for 21 HiFi BAMs plus the CPU to make them"
        source: "[REF 5 R11] — docs/05 budgeted only the FASTQ, and the validation battery requires BAMs (mosdepth, Clair3, Severus, provenance)"
        status: "with 703 GB of reads + ~2 TB of BAMs against 2.5 TB free, this does NOT fit -> risks.blockers.disk_does_not_fit"
        mitigation_options:
          - {value: "CRAM against ref/chm13.primary.fa (~40% of BAM)", source: "[REF 6 R2.4 D02]"}
          - {value: "delete the 15x FASTQ set once the 30x merge is verified", source: "[REF 6 R2.4 D03]"}
          - {value: "align, gate, and delete node by node rather than keeping all 21 BAMs", source: "[REF 6 R2.4 D01]"}

  known_deviations_from_real_hifi:
    substitution_deficit:
      value: "Badread pacbio2021 makes ~1 substitution per 100 errors; real HiFi makes 8-17"
      source: "[DOC 5 §3.2, §3.5] measured"
      consequence: "second-order for SV calling, FIRST-ORDER for anything scoring somatic SNVs off these reads — the data would look far cleaner than reality"
      fix_path: "retrain the error model with `badread error_model` from the on-disk real Revio slice, or inject substitutions post hoc. Neither is in Phase E as written."
    no_coverage_bias:
      value: "Badread coverage is pure Poisson (measured CV 0.0404 vs 0.0370 expected); real HiFi drops out in GA-rich regions and under-covers GC-rich VNTRs"
      source: "[DOC 5 §3.4, §2.4]"
      status: "declared deviation; would require GC/GA-keyed post-hoc subsampling"
    error_model_vintage:
      value: "pacbio2021 is trained on 2021 Sequel IIe HiFi; Revio runs DeepConsensus-class consensus on-instrument (which removes ~42% of remaining errors)"
      source: "[REF 5 R7] — the doc rejects the Q ceiling BECAUSE it is 2021-era and then anchors the error rate on a 2021-era measurement"
      decision: "the dataset is declared to target 2021-era Sequel IIe HiFi error characteristics with Revio LENGTH and Q-ALPHABET. Stated, not mixed silently."
    n_runs_are_sequenced:
      value: "[RESOLVED — NO LONGER APPLIES] Badread does not skip N; reads drawn from an
              assembly gap come out as runs of N"
      source: "[DOC 5 §1.5]"
      old_decision: "N-reads are RETAINED and counted. They do not align, so callable-genome depth is unaffected; the wasted fraction (~4.0% of generated bases) is reported per node."
      resolution: |
        This was the DECISIVE reason to leave hg38. The mitigation above was wrong in practice:
        MEASURED on the hg38 build, 86% of unmapped reads were poly-N, chr21 lost 15% of its
        reads, and non-N depth came out 18.57x against a 20x target — i.e. callable depth WAS
        affected. CHM13v2.0 has N = 0 (measured), so no read can be drawn from a gap and the
        wasted fraction is 0. What remains is badread's own --junk_reads 1 --random_reads 1
        (~2% by design, present in real data too); reads_gate R02 is set at >= 96.5% for that.

# =====================================================================================
validation:        # the numbered check battery. Gate order is load-bearing.
# =====================================================================================
  principles:
    - {value: "the generating code's own report is NEVER validation; every check uses an independent tool", source: "PLAN.md §4.2"}
    - {value: "T-series runs BEFORE any genome is materialised; G-series before D; F-series per node immediately after that node's FASTA is written", source: "[DOC 6 §0]"}
    - {value: "each check writes validate/results/<id>.json with tool version, seed, reference build and input checksum", source: "[REF 6 R4.11] — docs/06's {id,measured,expected,threshold,verdict} schema is self-defeating given its own warning that numbers are incomparable across tool versions"}
    - {value: "every script takes --threads, default 8", source: "[REF 6 R5.2] — docs/06 contradicted itself (cap 8-12, commands used -t16, plan used 4x8=32)"}

  germline_mode_caveat:
    value: "G03/G04/G07/G08/G12 are SELF-CONSISTENCY checks under meta.build_mode_germline = real_donor_copy — matching the panel we drew from is a tautology, not evidence"
    source: "[REF 6 R3.5] corrected — docs/06 applied this anti-circularity rule to G09 only"
    independent_realism_axes: "ROH/LD structure, the HGSVC3-vs-panel cross-check, and comparison against a HELD-OUT 1kGP sample never used in construction"

  G_germline:
    G01: {metric: "total variant sites, autosomes", expect: "4.0-4.8 M", source: "[REF 6 R3.1] corrected to the 30x resource: BB22 T1: 4,754,817 small variants per AMR sample (4,952,915 is the all-population mean); Auton 2015's 4.1-5.0 M is the low-coverage generation", verdict_rule: "PASS in band"}
    G02: {metric: "SNV count", expect: "3.4-4.1 M", source: "germline.snv.count", verdict_rule: "PASS in band"}
    G03: {metric: "SNV het/hom (PSC nHets/nNonRefHom)", expect: "1.40-1.85 genome-wide; NO autosome outside 1.30-2.30", source: "[REF 6 R2.1] corrected", correction: "docs/06's per-autosome band of 1.20-2.10 FAILS the real NA12878 on chr22 (2.150). A check that rejects the human it was calibrated against gets loosened at 3 a.m. or sends a correct genome back for rebuild.", verdict_rule: "FAIL if any autosome >3.0 or <0.8 — the everything-homozygous / everything-het failure"}
    G04: {metric: "Ti/Tv", expect: "1.95-2.20 genome-wide; per-chromosome 1.95-2.40 with spread >= 0.35", source: "[REF 6 R2.1] corrected (chr19 2.23, chr20 2.19, chr22 2.32 measured); spread gate from [DOC 2 §11]", verdict_rule: "PASS in band AND spread present — a flat per-chromosome Ti/Tv is a one-global-model tell"}
    G05: {metric: "exonic Ti/Tv", expect: "2.6-3.4", source: "[DOC 2 §1.3] GATK 3.0-3.3", note: "needs a CHM13 exon BED; [REF 6 R5.8] flagged that docs/06 named none, and none was built -> G05 is NOT among the 14 checks germline_gate.py actually runs"}
    G06: {metric: "indel count", expect: "0.70-0.90 M", source: "germline.small_indels.count"}
    G07: {metric: "indel ins:del", expect: "0.93-0.97", source: "[MEASURED] HG00733 0.9615", note: "[DOC 6 §10.1] records a competing literature value of 0.73 from short-read callsets that under-call insertions >10 bp; the panel is SV-integrated and partly rescues them"}
    G08: {metric: "indel length spectrum", expect: "1 bp 47-52%; 4bp>3bp; 8bp>7bp", source: "germline.small_indels.length_spectrum", correction: "docs/06's G08 demanded MONOTONE decay and 'no spike >1.5x its neighbours' — that rule FAILS real data, where the STR bumps are the realism signal"}
    G09: {metric: "dbSNP b156 overlap", expect: "N/A", source: "[REF 6 R3.4] — the cited 1.99% novel rate is actually 1.79%, from a Qatari cohort in an arXiv preprint. Under real_donor_copy the check is meaningless; measure the donor's own novel fraction and report it, do not gate it."}
    G10: {metric: "gnomAD AF spectrum", expect: "96.0-99.5% of germline SNVs at AF > 0.001", source: "[REF 6 R3.3] corrected", correction: "docs/06 required '>=90%', far too loose: Auton's rare fraction is 1-4% (40,000-200,000 variants at AF<0.5%), so a generator emitting 10x too many rare variants sails through 90%. Two-sided: 100% is also wrong.", note: "join on the 4-tuple (chr,pos,ref,alt), never position alone; bcftools norm -f on BOTH sides first"}
    G11: {metric: "F_ROH (>=1 Mb)", expect: "0.001 <= F_ROH <= 0.02", source: "[REF 6 R5.6] corrected to two-sided — no real human has zero ROH", blocker: "bcftools roh needs an AF tag; use the panel's own AF_AMR [DOC 2 §10.6]"}
    G12: {metric: "side-by-side vs a HELD-OUT 1kGP sample", expect: "|d het/hom| <= 0.20; |d Ti/Tv| <= 0.10; indel-length spectrum max bin diff <= 5 pp", source: "[REF 6 R3.5] corrected — compare against a sample NOT used in construction, not against the file we drew from"}
    G13: {metric: "1-Mb density CV over CALLABLE bases", expect: "0.33-0.47", source: "[DOC 2 §7.2]; denominator per [REF 2 B3]/[REF 6 R5.7]", verdict_rule: "FAIL if CV < 0.15 — Poisson/uniform placement gives ~0.03"}
    G14: {metric: "germline SV count", expect: "20,000-27,000 (assembly tier)", source: "[REF 6 R2.7] — docs/06 had NO germline SV check at all, the single largest realism gap for a somatic-SV benchmark", why: "a somatic SV caller's false-positive rate is dominated by germline SVs it must not call; a ~4,300-SV background makes snape look far better here than in reality"}
    G15: {metric: "germline SV class mix + ins:del", expect: "ins:del 1.50-1.70; INS and DEL both >> DUP/INV; CTX = 0", source: "germline.structural_variants"}
    G16: {metric: "germline SV size spectrum", expect: "DEL median 141 (p25 73, p75 328, p95 2,553); INS median 198; >=1 kb ~3,238; MEI peaks present at ~300 bp (Alu), ~1-2 kb (SVA), ~6 kb (L1)", source: "[REF 2 B2] + [REF 6 R2.7]", verdict_rule: "a smooth size distribution with no mobile-element peaks is instantly recognisable as simulated"}
    G17: {metric: "germline SV het/hom", expect: "1.70-2.10, and ordering SNV < SV < INDEL", source: "[REF 2 B1] corrected"}

  S_somatic:
    S01: {metric: "somatic SBS per leaf", expect: "within 0.5x-2.0x of 8,990", source: "somatic.per_leaf_burden.sbs", correction: "[REF 6 R2.3] DELETED docs/06's 'FAIL if the 20 leaves span < 1.2x of each other'. With trunk 0.55 the maximum achievable span is 1/(1-f); the rule was testing branch-length variance, not evolution, and was arithmetically incompatible with the declared clonality model."}
    S01b: {metric: "per-leaf private fraction", expect: "private_i/(T+B_i) matches spec/tree.json to +/-10%", source: "[REF 6 R2.3] replacement check"}
    S02: {metric: "indel:SBS ratio", expect: "0.05-0.20", source: "[DOC 6 §4.1] Priestley 2019"}
    S03: {metric: "somatic SV junctions and events per leaf", expect: "junctions within 0.5x-2.0x of 393; events of 273", source: "somatic.per_leaf_burden", note: "always state which unit; [DOC 3 §0]"}
    S04: {metric: "somatic zygosity / VAF", expect: "het >= 0.60; hom <= 0.35 with >=80% inside declared LOH; VAF histogram MULTI-MODAL with a mode at m/CN per realised multiplicity and a secondary mode at 1.0; ZERO somatic SNVs in CN=0 segments", source: "[DOC 6 §4.1 S04] + [REF 3 R2.6] correction", verdict_rule: "FAIL if >50% homozygous — the user's named failure mode on the somatic side"}
    S05: {metric: "declared subclonal fraction", expect: "measured == declared +/- 0.03", source: "[REF 6 R2.3] corrected", correction: "docs/06's band of 6-61% is a 10x window that cannot fail for any plausible input"}
    S05b: {metric: "pseudo-bulk subclonal fraction AT the CCF>=0.30 detection limit", expect: "reported and compared to PCAWG breast 6.7%", source: "[REF 3 R2.5]; somatic.distribution_over_the_tree.implied_pseudobulk_subclonal_fraction", verdict_rule: "REPORT, do not gate — but a wildly discordant number means the branch budget is wrong"}
    S07: {metric: "SV class rank order", expect: "DEL > DUP > unbalanced TRA; reciprocal events each < 10%", source: "[DOC 6 §4.1] Li 2020", caveat: "[REF 6 R5.11] COLO829's own mix has TRA (13) > DUP (7); keep COLO829 as an S03/R07 anchor only"}
    S07b: {metric: "replication-timing polarity", expect: "DEL and DUP enrichment run in OPPOSITE directions (DEL late-replicating, DUP early)", source: "[REF 6 R3.10] — docs/06's rank-order-only PASS is satisfied by a simulator that places every SV uniformly at random", status: "needs a Repli-seq track; not on box"}
    S08: {metric: "SV size histogram", expect: "not unimodal (dip test p<0.05 or >=2 maxima >=0.5 log10 apart)", source: "[DOC 6 §4.1] Li 2020", caveat: "unimodal WITHIN a patient is the published finding — this gate tests the cohort-shaped mixture and is weak; S07b is the real placement check"}
    S09: {metric: "signature refit (SigProfilerAssignment cosmic_fit)", expect: "spectrum cosine >= 0.95; each injected signature >= 0.90 to its COSMIC reference; exposure within +/-20% for every signature contributing >=10%", source: "[DOC 6 §4.1]", caveat: "[REF 6 R5.12] the +/-20% exposure tolerance is UNSOURCED"}
    S10: {metric: "blind extraction (SigProfilerExtractor)", expect: ">=80% of injected signatures with exposure >=10% recovered at cosine >=0.90", source: "[DOC 6 §4.1]", priority: secondary}
    S11: {metric: "SV junction microhomology distribution", expect: "non-degenerate (NOT 100% blunt); modes at 2-7 bp and 10-30 bp present", source: "[REF 6 R3.11]", measured_from: "the truth FASTA, not the generator's report"}
    S12: {metric: "rainfall / inter-mutation distance plot", expect: "kataegis foci visible; NOT flat", source: "[REF 6 R4.9] — a flat rainfall plot is the most recognisable 'this is simulated' signature there is"}

  T_tree:
    T01: {metric: "structure", expect: "20 tumour leaves, germline is the ROOT, strictly binary", source: "tree.n_leaves"}
    T02: {metric: "branch additivity", expect: "leafset == pathunion MINUS lost_by_declared_CN_loss, keyed on STABLE MUTATION UUID", source: "[REF 6 R2.2] corrected", correction: "docs/06's 'exact set equality, 0 extra 0 missing' is unsatisfiable by construction — any trunk mutation on a deleted arm is legitimately gone, and the per-node VCFs are in different coordinate spaces so coordinate keys do not even compare"}
    T02b: {metric: "loss accounting", expect: ">=99% of each leaf's lost set lies inside its declared LOH/CN-loss intervals; the lost COUNT is reported per leaf as a realism number in its own right", source: "[REF 6 R2.2]"}
    T03: {metric: "pairwise sharing", expect: "Spearman rho(Jaccard, -patristic distance) >= 0.95 over the 190 leaf pairs", source: "[DOC 6 §5]"}
    T04: {metric: "topology reconstruction", expect: "normalised Robinson-Foulds == 0 from NJ AND parsimony on the leaf x somatic-site matrix", source: "[DOC 6 §5]", tool: "DendroPy or ete3 (both pip-resolve here)"}
    T05: {metric: "tree balance", expect: "Sackin 111 and cherry count 7 inside the central 90% of a 10,000-tree Yule null for n=20", source: "[REF 1 M3] corrected", correction: "gate on Sackin + ONE genuinely independent statistic (cherry count). J1 is algebraically Sackin here and Colless is near-collinear; docs/01 §8.2's 'none of the four rejects' overstates the evidence ~2x in degrees of freedom.", disclosure: "the tree was hand-tuned to this percentile — see tree.shape_statistics.circularity_disclosure"}
    T06: {metric: "CN-based phylogeny (MEDICC2)", expect: "RF <= 2 vs truth", source: "[DOC 6 §5]", prerequisite: "[REF 6 R4.2] — allele-specific CN profiles per leaf must actually be produced; no step currently emits them"}
    T07: {metric: "infinite-sites / tree fit of shared SNVs", expect: "88-98% fit perfectly, AND >=80% of the misfits explained by an overlapping subclonal CN loss; homoplasy ~0", source: "[REF 1 B5] corrected", correction: "docs/01's '>=95% must fit' is stricter than 2 of Roerink's 3 patients AND would be passed by a simulation with no subclonal deletions at all — exactly the wrong incentive"}

  F_fasta:
    F00: {metric: "truth-VCF self-validation BEFORE anything is built", expect: "bcftools norm --check-ref e passes; left-aligned; no overlapping ALTs on one haplotype; no duplicate keys", source: "[REF 6 R4.7] — one command, catches a whole class of generator bugs at Phase C instead of Phase E"}
    F01: {metric: "haplotype aligns end-to-end (minimap2 -cx asm5 --cs)", expect: ">=98% of bases in alignments >=10 kb", source: "[DOC 6 §6.4]"}
    F02: {metric: "small-variant recall (paftools.js call + rtg vcfeval)", expect: "GT-match recall >=0.98 AND precision >=0.98 in the callable BED", source: "[DOC 6 §6.4] + [REF 6 R4.6]", correction: "gate on GENOTYPE-match recall, not plain recall — otherwise a het truth variant recovered as hom-alt counts as recovered and the headline failure mode survives the entire battery"}
    F03: {metric: "SV recall (truvari bench --pctseq 0.7 --pctsize 0.7 --refdist 500)", expect: "F1 >= 0.90", source: "[DOC 6 §6.4]", blocker: "invoke as `python -m truvari` — the console script has a stale /home/yuio/svp/ shebang ([REF 6 R2.6])"}
    F04: {metric: "second independent method (svim-asm or nucmer)", expect: "|d recall| <= 0.05", source: "[DOC 6 §6.4]", scope: "3 nodes (root, one mid-branch, one deep leaf) — all 21 costs ~350 CPU-h and buys little"}
    F05: {metric: "direct base extraction, 10,000 random truth ALTs, zero aligner involvement", expect: "100% exact", source: "[DOC 6 §6.4]", scope: "all 21 nodes; nearly free", verdict_rule: "any mismatch is a hard stop"}

  R_reads:
    R01: {metric: "measured depth (mosdepth) over CALLABLE bases", expect: "genome-wide mean within +/-5% of target", source: "[DOC 6 §7]; docs/07 §4 makes this a gate before a read set is accepted"}
    R02: {metric: "coverage uniformity", expect: ">=90% of 1 kb autosomal bins in [0.5,1.5]x mean AND 1.05 <= fold-80 < 2.0", source: "[REF 6 R5.4] corrected", correction: "docs/06 demanded fold-80 < 1.5 while citing <2.0 as good; and 'also FAIL if perfectly flat' had no numeric lower bound"}
    R02b: {metric: "NO shard-boundary notch", expect: "no coverage depression at any contig join (+/-30 kb)", source: "[DOC 5 §11]"}
    R03: {metric: "read length distribution", expect: "two-sample KS vs a real Revio run, p > 0.01", source: "[REF 6 R3.9] corrected", correction: "docs/06's 'N50 13-22 kb' is a tautology — Badread's --length sets exactly that. Passing proves the parameters were passed through."}
    R04: {metric: "per-read Q distribution", expect: "two-sample KS vs real Revio, p > 0.01; exactly the 7 real levels; max Q = 40; per-level frequency |d| <= 2 pp", source: "[REF 5 R4] + [REF 6 R3.9] corrected"}
    R05: {metric: "read identity (Badread header + independent realignment)", expect: "median 99.852% +/- 0.03; p01 >= 99.0%; KS of -10log10(1-identity) vs N(28.3,3) p>0.01", source: "[REF 5 R3] corrected", correction: "docs/05 §11's 'no read below 98%' is mathematically unsatisfiable: at 27,3 that is P=4.2e-4, i.e. ~49,000 reads across the 21-genome set, and a fresh smoke run measured a minimum of 97.679%. Gate the DISTRIBUTION, never the minimum."}
    R05b: {metric: "error composition (realign to the node's OWN haplotype)", expect: "total 0.186% +/- 0.02; deletion 0.135% +/- 0.015; ins:del 0.36 +/- 0.03; indels > substitutions", source: "reads.flags.identity", note: "ins:del 0.36 and 72% of deletions in HP>=3 are BADREAD's values, not real HiFi's (0.62-0.77 and 50.5%) — a declared deviation, not a target"}
    R06: {metric: "germline variant recall from reads (Clair3 or DeepVariant + rtg vcfeval)", expect: "SNP GT-recall >= 0.995 and INDEL >= 0.98 at 30x, AND within 0.005 / 0.015 of the same caller's recall on real HG002 HiFi through the identical command", source: "[REF 6 R3.2] corrected", correction: "docs/06's ceilings were not in the sources cited: the 2019 DeepVariant blog reports SNP F1 0.9957 at 13.7x (not 0.9992-0.9993), and Clair3 on PacBio reports SNP 0.9988 / INDEL 0.9907 (not 0.8814, which is an ONT-class indel number, ~11 pp low). Against a true ceiling of ~0.99, docs/06's INDEL>=0.95 would have declared PASS on a simulation 3.5 pp harder than reality."}
    R07: {metric: "somatic SV recall (Severus + sniffles2, truvari bench)", expect: "recall >= 0.85, precision >= 0.90 at 30x", source: "[DOC 6 §7]"}
    R08: {metric: "read provenance audit", expect: "100% of reads WITH a genomic source interval map back correctly", source: "[REF 6 R3.8] corrected", correction: "Badread's read NAME is a random UUID; the source locus is in the DESCRIPTION after the first whitespace. minimap2 drops the FASTQ comment unless -y is passed. Chimeric reads carry two comma-joined intervals.", note: "[REF 5 R13] for nodes 2-21 those coordinates are in the NODE's own mutated space — apply the PAF projection before comparing"}
    R09: {metric: "negative control", expect: "somatic calls from germline-vs-germline (different read seeds) < N, N declared before the run", source: "[REF 6 R4.4] — every other R/F threshold is a recall on truth; nothing currently checks the number that matters most"}
    R10: {metric: "haplotype coverage balance", expect: "per-haplotype read-count ratio 0.45-0.55 in 1 Mb bins outside declared CN-altered regions", source: "[REF 6 R4.5] — the read-level analogue of the user's #1 fear; a 60/40 imbalance shifts every het VAF and looks exactly like broken zygosity three phases later"}

  B_benchmarks:
    role: {value: "CALIBRATION, not pass/fail on our data. Run the identical command on the gold sample and on ours, report both. A metric BETTER than the gold sample means our simulation is unrealistically clean — that is a finding, not a success.", source: "[DOC 6 §8]"}
    available_on_box:
      value: "castle_truth.tar.gz (14.96 GB) already contains HG002_SVs_Tier1_v0.6.bed, HG002 GRCh37 VCF, the COLO829 somatic-SV truth VCF (hg38-lifted), HCC1395 + a HiFi/ONT PURITY ladder (20/40/60/80%) and DEPTH ladder (10/20/30/60x), and chm13_chm1"
      source: "[REF 6 R2.5] corrected"
      correction: "docs/06 §8 asserted 'none of the four standard truth sets is present on this box (verified by find)'. find matches file NAMES and cannot see inside a tarball; the doc itself flagged the tarball as unopened and then concluded the opposite. The download plan shrinks to 'GIAB HG002 small-variant v4.2.1/v5.0 VCF only'."
    B03_anchor: {value: "COLO829 = 68 validated somatic SVs (38 DEL, 3 INS, 7 DUP, 7 INV, 13 TRA); a 2025 Genome Research re-analysis gives 54 STABLE somatic SVs across replicates in BOTH GRCh38 and CHM13 coordinates, and reports 346 SVs (1.13%) seen in only one replicate", source: "[DOC 6 §8] + [REF 6 R4.1]", caveat: "the replicate instability directly undercuts the 'pure clonal cell line' premise of S04 — record it"}
    B04_anchor: {value: "SEQC2 HCC1395 = 39,536 high-confidence somatic SNVs + 2,020 indels", source: "[DOC 6 §8]"}

  D_disk_and_compute:
    D01: {metric: "pre-flight df before each phase against a declared byte budget", expect: "no phase starts below its budget; 85% full = stop and analyse", source: "[REF 6 R2.4] + PLAN.md §4.6"}
    D02: {metric: "reads stored as .fq.gz (re-binned) or CRAM; BAMs not all retained", expect: "peak /home usage < 2.2 TB", source: "[REF 6 R2.4]"}
    D03: {metric: "the 15x set is CONSUMED by the 30x merge, not retained alongside it", expect: "verified before deletion", source: "[REF 6 R2.4]"}

  tool_state:
    verified_working: "bcftools 1.21, samtools 1.21, minimap2 2.31, paftools.js + k8-1.2, bedtools, uv, docker, insilicosv 0.1.9, matplotlib, plot-vcfstats"
    broken_console_script: {value: "truvari (module imports at 5.4.0; the entry point carries a stale /home/yuio/svp/.venv shebang)", source: "[REF 6 R2.6]"}
    missing: "rtg-tools (needed by G12/F02/R06 — single Java jar, install EARLY), mosdepth, seqkit, cramino, svim-asm, sniffles2, DeepVariant/Clair3 images"
    source: "[DOC 6 §1] as corrected by [REF 6 R2.6] — the doc's table was built with ls, not --version; two of its local-state claims did not survive testing"

